[tool.poetry]
name = "api-django"
version = "0.1.0"
description = ""
authors = ["Hashim"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.12.4"
django = "5.1"
djangorestframework = "3.15.2"
psycopg2-binary = "2.9.9"
gunicorn = "22.0.0"
python-dotenv = "^1.0.1"
pyspark = "^3.5.5"
ijson = "^3.3.0"
polars = "^1.28.1"
django-celery-results = "^2.6.0"
redis = "^5.2.1"
requests = "^2.32.3"
django-prometheus = "^2.3.1"
prometheus-client = "^0.21.1"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.2"
pytest-django = "^4.8.0"
flake8 = "^7.1.1"
black = "^24.8.0"
factory-boy = "^3.3.0"
pylint = "^3.2.6"
flake8-isort = "^6.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.isort]
profile = "black" 
line_length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "apidjango.settings"